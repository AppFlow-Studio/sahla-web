
[functions.sync-prayer-times]
enabled = true
# Invoked by the bi-weekly prayer cron via net.http_post, which sends no
# Authorization header — with verify_jwt on, every run dies at the gateway with
# UNAUTHORIZED_NO_AUTH_HEADER before the function boots. It reads mosques and
# writes todays_prayers under the service role and trusts nothing from the
# caller. Staging was broken exactly this way; prod only kept working because it
# still ran an older build with this off.
verify_jwt = false
import_map = "./functions/sync-prayer-times/deno.json"
entrypoint = "./functions/sync-prayer-times/index.ts"

[functions.sync-app-builds]
enabled = true
# Invoked by the app-builds sync cron via net.http_post (no Authorization
# header). Read-only against external stores; only writes HQ build tables the
# service role already owns — safe to leave unauthenticated.
verify_jwt = false
import_map = "./functions/sync-app-builds/deno.json"
entrypoint = "./functions/sync-app-builds/index.ts"

[functions.stripe-webhooks]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhooks/deno.json"
entrypoint = "./functions/stripe-webhooks/index.ts"

[functions.send-push]
enabled = true
# Drained by the per-minute cron via net.http_post (no Authorization header).
# Safe to leave unauthenticated: it only delivers rows the auth-gated enqueue
# route already wrote — it never accepts a push payload over the wire.
verify_jwt = false
import_map = "./functions/send-push/deno.json"
entrypoint = "./functions/send-push/index.ts"

[functions.clerk-webhooks]
enabled = true
# Clerk uses Svix HMAC signatures, not Supabase JWTs. Keep this off or
# every Clerk webhook call gets rejected at the auth layer.
verify_jwt = false
import_map = "./functions/clerk-webhooks/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/clerk-webhooks/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/clerk-webhooks/*.html" ]

[functions.cal-webhook]
enabled = true
# Cal.com uses its own HMAC-SHA256 signature in X-Cal-Signature-256.
# Verified inside the function against CAL_WEBHOOK_SECRET; keep Supabase's
# JWT check off so Cal.com's requests aren't rejected at the auth layer.
verify_jwt = false
entrypoint = "./functions/cal-webhook/index.ts"

[functions.send-prayer-notifications]
enabled = true
# Driven by the per-minute cron via net.http_post (no Authorization header).
# Resolves each mosque's local "now" and pushes only times already stored in
# todays_prayers — it accepts no payload from the caller. Previously had no
# block at all, which silently defaults to verify_jwt = true.
verify_jwt = false
entrypoint = "./functions/send-prayer-notifications/index.ts"

[functions.get-todays-prayers]
enabled = true
# Service-role read bypass for prayer times (see the note at the top of the
# function). Declared explicitly so the deployed setting stops depending on
# whatever was last pushed by hand.
verify_jwt = false
entrypoint = "./functions/get-todays-prayers/index.ts"
